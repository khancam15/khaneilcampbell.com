<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="log analysis diagram">
<rect width="700" height="420" fill="#ffffff"/>
<rect x="28.0" y="28" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="48.0" cy="52" r="4" fill="#8995a6"/>
<text x="60.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">01</text>
<text x="48.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Ingest</text>
<text x="48.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">Windows Security events</text>
<text x="48.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">normalized into Splunk</text>
<rect x="360.0" y="28" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="380.0" cy="52" r="4" fill="#8995a6"/>
<text x="392.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">02</text>
<text x="380.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Detect</text>
<text x="380.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">SPL groups failed logons by</text>
<text x="380.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">source host and account</text>
<rect x="28.0" y="144" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#1470af" stroke-width="2"/>
<circle cx="48.0" cy="168" r="4" fill="#1470af"/>
<text x="60.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">03</text>
<text x="48.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Tune</text>
<text x="48.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">Threshold raised until routine</text>
<text x="48.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">noise drops out</text>
<rect x="360.0" y="144" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="380.0" cy="168" r="4" fill="#8995a6"/>
<text x="392.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">04</text>
<text x="380.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Respond</text>
<text x="380.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">Triage notes and escalation</text>
<text x="380.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">criteria written for reuse</text>
<line x1="28" y1="256" x2="672" y2="256" stroke="#dde6f1" stroke-width="1"/>
<text x="28" y="274" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.8" fill="#8995a6">EVIDENCE</text>
<text x="28.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">Event ID 4625</text>
<text x="360.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">80+ failed logons isolated</text>
<text x="28.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">One defined time window</text>
<text x="360.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">Repeatable by someone else</text>
<text x="28" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#8995a6">The tuning step is where most of the work went. A detection</text>
<text x="28" y="375" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#8995a6">nobody trusts gets muted.</text>
</svg>