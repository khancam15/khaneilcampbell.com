<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="log analysis diagram">
<rect width="700" height="420" fill="#f4f6f8"/>
<rect x="28.0" y="28" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#d9dfe5" stroke-width="1"/>
<circle cx="48.0" cy="52" r="4" fill="#59606a"/>
<text x="60.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#59606a">01</text>
<text x="48.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#12151a">Ingest</text>
<text x="48.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">Windows Security events</text>
<text x="48.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">normalized into Splunk</text>
<rect x="360.0" y="28" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#d9dfe5" stroke-width="1"/>
<circle cx="380.0" cy="52" r="4" fill="#59606a"/>
<text x="392.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#59606a">02</text>
<text x="380.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#12151a">Detect</text>
<text x="380.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">SPL groups failed logons by</text>
<text x="380.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">source host and account</text>
<rect x="28.0" y="144" width="312.0" height="96" rx="3" fill="#eef4fb" stroke="#2a64a8" stroke-width="2"/>
<circle cx="48.0" cy="168" r="4" fill="#2a64a8"/>
<text x="60.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#59606a">03</text>
<text x="48.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#12151a">Tune</text>
<text x="48.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">Threshold raised until routine</text>
<text x="48.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">noise drops out</text>
<rect x="360.0" y="144" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#d9dfe5" stroke-width="1"/>
<circle cx="380.0" cy="168" r="4" fill="#59606a"/>
<text x="392.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#59606a">04</text>
<text x="380.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#12151a">Respond</text>
<text x="380.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">Triage notes and escalation</text>
<text x="380.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">criteria written for reuse</text>
<line x1="28" y1="256" x2="672" y2="256" stroke="#d9dfe5" stroke-width="1"/>
<text x="28" y="274" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.8" fill="#59606a">EVIDENCE</text>
<text x="28.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#12151a">Event ID 4625</text>
<text x="360.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#12151a">80+ failed logons isolated</text>
<text x="28.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#12151a">One defined time window</text>
<text x="360.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#12151a">Repeatable by someone else</text>
<text x="28" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#59606a">The tuning step is where most of the work went. A detection</text>
<text x="28" y="375" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#59606a">nobody trusts gets muted.</text>
</svg>