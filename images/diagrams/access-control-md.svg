<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="access control diagram">
<rect width="700" height="420" fill="#ffffff"/>
<rect x="28.0" y="28" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="48.0" cy="52" r="4" fill="#8995a6"/>
<text x="60.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">01</text>
<text x="48.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Request</text>
<text x="48.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">The access, recovery or MFA</text>
<text x="48.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">need is stated plainly</text>
<rect x="360.0" y="28" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#1470af" stroke-width="2"/>
<circle cx="380.0" cy="52" r="4" fill="#1470af"/>
<text x="392.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">02</text>
<text x="380.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Verify</text>
<text x="380.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">Identity, ownership and</text>
<text x="380.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">approval path validated</text>
<rect x="28.0" y="144" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="48.0" cy="168" r="4" fill="#8995a6"/>
<text x="60.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">03</text>
<text x="48.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Control</text>
<text x="48.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">Least privilege, MFA and group</text>
<text x="48.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">membership applied</text>
<rect x="360.0" y="144" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="380.0" cy="168" r="4" fill="#8995a6"/>
<text x="392.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">04</text>
<text x="380.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Record</text>
<text x="380.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">Rationale, changes and review</text>
<text x="380.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">date documented</text>
<line x1="28" y1="256" x2="672" y2="256" stroke="#dde6f1" stroke-width="1"/>
<text x="28" y="274" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.8" fill="#8995a6">CHECKED AGAINST</text>
<text x="28.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">Directory attributes</text>
<text x="360.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">Group membership</text>
<text x="28.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">MFA state</text>
<text x="360.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">Business justification</text>
<text x="28" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#8995a6">Verification is the step that gets skipped when the person</text>
<text x="28" y="375" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#8995a6">asking is senior and in a hurry.</text>
</svg>