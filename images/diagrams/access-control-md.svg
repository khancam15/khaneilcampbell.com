<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="access control diagram">
<rect width="700" height="420" fill="#0e1116"/>
<rect x="28.0" y="28" width="312.0" height="96" rx="3" fill="#141820" stroke="#262d38" stroke-width="1"/>
<circle cx="48.0" cy="52" r="4" fill="#8f9aaa"/>
<text x="60.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8f9aaa">01</text>
<text x="48.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#f2f5f9">Request</text>
<text x="48.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#aab4c2">The access, recovery or MFA</text>
<text x="48.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#aab4c2">need is stated plainly</text>
<rect x="360.0" y="28" width="312.0" height="96" rx="3" fill="#0f1c2e" stroke="#3d9bff" stroke-width="2"/>
<circle cx="380.0" cy="52" r="4" fill="#3d9bff"/>
<text x="392.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8f9aaa">02</text>
<text x="380.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#f2f5f9">Verify</text>
<text x="380.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#aab4c2">Identity, ownership and</text>
<text x="380.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#aab4c2">approval path validated</text>
<rect x="28.0" y="144" width="312.0" height="96" rx="3" fill="#141820" stroke="#262d38" stroke-width="1"/>
<circle cx="48.0" cy="168" r="4" fill="#8f9aaa"/>
<text x="60.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8f9aaa">03</text>
<text x="48.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#f2f5f9">Control</text>
<text x="48.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#aab4c2">Least privilege, MFA and group</text>
<text x="48.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#aab4c2">membership applied</text>
<rect x="360.0" y="144" width="312.0" height="96" rx="3" fill="#141820" stroke="#262d38" stroke-width="1"/>
<circle cx="380.0" cy="168" r="4" fill="#8f9aaa"/>
<text x="392.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8f9aaa">04</text>
<text x="380.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#f2f5f9">Record</text>
<text x="380.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#aab4c2">Rationale, changes and review</text>
<text x="380.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#aab4c2">date documented</text>
<line x1="28" y1="256" x2="672" y2="256" stroke="#262d38" stroke-width="1"/>
<text x="28" y="274" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.8" fill="#8f9aaa">CHECKED AGAINST</text>
<text x="28.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#f2f5f9">Directory attributes</text>
<text x="360.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#f2f5f9">Group membership</text>
<text x="28.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#f2f5f9">MFA state</text>
<text x="360.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#f2f5f9">Business justification</text>
<text x="28" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#8f9aaa">Verification is the step that gets skipped when the person</text>
<text x="28" y="375" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#8f9aaa">asking is senior and in a hurry.</text>
</svg>