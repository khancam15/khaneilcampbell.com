<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" role="img" aria-label="access control diagram">
<rect width="700" height="460" fill="#f4f6f8"/>
<rect x="28.0" y="28" width="312.0" height="116" rx="3" fill="#ffffff" stroke="#d9dfe5" stroke-width="1"/>
<circle cx="48.0" cy="52" r="4" fill="#59606a"/>
<text x="60.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#59606a">01</text>
<text x="48.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#12151a">Request</text>
<text x="48.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">The access, recovery or MFA</text>
<text x="48.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">need is stated plainly</text>
<rect x="360.0" y="28" width="312.0" height="116" rx="3" fill="#eef4fb" stroke="#2a64a8" stroke-width="2"/>
<circle cx="380.0" cy="52" r="4" fill="#2a64a8"/>
<text x="392.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#59606a">02</text>
<text x="380.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#12151a">Verify</text>
<text x="380.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">Identity, ownership and</text>
<text x="380.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">approval path validated</text>
<rect x="28.0" y="164" width="312.0" height="116" rx="3" fill="#ffffff" stroke="#d9dfe5" stroke-width="1"/>
<circle cx="48.0" cy="188" r="4" fill="#59606a"/>
<text x="60.0" y="192" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#59606a">03</text>
<text x="48.0" y="220" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#12151a">Control</text>
<text x="48.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">Least privilege, MFA and group</text>
<text x="48.0" y="266" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">membership applied</text>
<rect x="360.0" y="164" width="312.0" height="116" rx="3" fill="#ffffff" stroke="#d9dfe5" stroke-width="1"/>
<circle cx="380.0" cy="188" r="4" fill="#59606a"/>
<text x="392.0" y="192" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#59606a">04</text>
<text x="380.0" y="220" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#12151a">Record</text>
<text x="380.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">Rationale, changes and review</text>
<text x="380.0" y="266" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#454b54">date documented</text>
<line x1="28" y1="296" x2="672" y2="296" stroke="#d9dfe5" stroke-width="1"/>
<text x="28" y="314" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.8" fill="#59606a">CHECKED AGAINST</text>
<text x="28.0" y="340" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#12151a">Directory attributes</text>
<text x="360.0" y="340" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#12151a">Group membership</text>
<text x="28.0" y="362" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#12151a">MFA state</text>
<text x="360.0" y="362" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#12151a">Business justification</text>
<text x="28" y="398" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#59606a">Verification is the step that gets skipped when the person</text>
<text x="28" y="415" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#59606a">asking is senior and in a hurry.</text>
</svg>