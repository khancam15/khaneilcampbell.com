<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 612" width="360" height="612" role="img" aria-label="access control diagram">
<rect width="360" height="612" fill="#ffffff"/>
<rect x="18" y="18" width="324" height="86" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="34" cy="38" r="3.5" fill="#8995a6"/>
<text x="44" y="42" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8995a6">01</text>
<text x="72" y="43" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#0d1521">Request</text>
<text x="34" y="64" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#4d596a">The access, recovery or MFA need is</text>
<text x="34" y="81" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#4d596a">stated plainly</text>
<path d="M 176 107 l 4 5 l 4 -5" fill="none" stroke="#8995a6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="18" y="116" width="324" height="86" rx="3" fill="#ffffff" stroke="#1470af" stroke-width="2"/>
<circle cx="34" cy="136" r="3.5" fill="#1470af"/>
<text x="44" y="140" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8995a6">02</text>
<text x="72" y="141" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#0d1521">Verify</text>
<text x="34" y="162" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#4d596a">Identity, ownership and approval</text>
<text x="34" y="179" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#4d596a">path validated</text>
<path d="M 176 205 l 4 5 l 4 -5" fill="none" stroke="#8995a6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="18" y="214" width="324" height="86" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="34" cy="234" r="3.5" fill="#8995a6"/>
<text x="44" y="238" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8995a6">03</text>
<text x="72" y="239" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#0d1521">Control</text>
<text x="34" y="260" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#4d596a">Least privilege, MFA and group</text>
<text x="34" y="277" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#4d596a">membership applied</text>
<path d="M 176 303 l 4 5 l 4 -5" fill="none" stroke="#8995a6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="18" y="312" width="324" height="86" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="34" cy="332" r="3.5" fill="#8995a6"/>
<text x="44" y="336" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8995a6">04</text>
<text x="72" y="337" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#0d1521">Record</text>
<text x="34" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#4d596a">Rationale, changes and review date</text>
<text x="34" y="375" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#4d596a">documented</text>
<line x1="18" y1="406" x2="342" y2="406" stroke="#dde6f1" stroke-width="1"/>
<text x="18" y="420" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.6" fill="#8995a6">CHECKED AGAINST</text>
<text x="18" y="440" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#0d1521">Directory attributes</text>
<text x="18" y="460" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#0d1521">Group membership</text>
<text x="18" y="480" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#0d1521">MFA state</text>
<text x="18" y="500" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#0d1521">Business justification</text>
<text x="18" y="530" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8995a6">Verification is the step that gets skipped</text>
<text x="18" y="546" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8995a6">when the person asking is senior and in a</text>
<text x="18" y="562" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8995a6">hurry.</text>
</svg>