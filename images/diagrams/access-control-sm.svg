<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 612" width="360" height="612" role="img" aria-label="access control diagram">
<rect width="360" height="612" fill="#0e1116"/>
<rect x="18" y="18" width="324" height="86" rx="3" fill="#141820" stroke="#262d38" stroke-width="1"/>
<circle cx="34" cy="38" r="3.5" fill="#8f9aaa"/>
<text x="44" y="42" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8f9aaa">01</text>
<text x="72" y="43" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#f2f5f9">Request</text>
<text x="34" y="64" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">The access, recovery or MFA need is</text>
<text x="34" y="81" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">stated plainly</text>
<path d="M 176 107 l 4 5 l 4 -5" fill="none" stroke="#66717f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="18" y="116" width="324" height="86" rx="3" fill="#0f1c2e" stroke="#3d9bff" stroke-width="2"/>
<circle cx="34" cy="136" r="3.5" fill="#3d9bff"/>
<text x="44" y="140" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8f9aaa">02</text>
<text x="72" y="141" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#f2f5f9">Verify</text>
<text x="34" y="162" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">Identity, ownership and approval</text>
<text x="34" y="179" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">path validated</text>
<path d="M 176 205 l 4 5 l 4 -5" fill="none" stroke="#66717f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="18" y="214" width="324" height="86" rx="3" fill="#141820" stroke="#262d38" stroke-width="1"/>
<circle cx="34" cy="234" r="3.5" fill="#8f9aaa"/>
<text x="44" y="238" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8f9aaa">03</text>
<text x="72" y="239" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#f2f5f9">Control</text>
<text x="34" y="260" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">Least privilege, MFA and group</text>
<text x="34" y="277" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">membership applied</text>
<path d="M 176 303 l 4 5 l 4 -5" fill="none" stroke="#66717f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="18" y="312" width="324" height="86" rx="3" fill="#141820" stroke="#262d38" stroke-width="1"/>
<circle cx="34" cy="332" r="3.5" fill="#8f9aaa"/>
<text x="44" y="336" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8f9aaa">04</text>
<text x="72" y="337" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#f2f5f9">Record</text>
<text x="34" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">Rationale, changes and review date</text>
<text x="34" y="375" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">documented</text>
<line x1="18" y1="406" x2="342" y2="406" stroke="#262d38" stroke-width="1"/>
<text x="18" y="420" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.6" fill="#8f9aaa">CHECKED AGAINST</text>
<text x="18" y="440" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#f2f5f9">Directory attributes</text>
<text x="18" y="460" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#f2f5f9">Group membership</text>
<text x="18" y="480" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#f2f5f9">MFA state</text>
<text x="18" y="500" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#f2f5f9">Business justification</text>
<text x="18" y="530" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8f9aaa">Verification is the step that gets skipped</text>
<text x="18" y="546" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8f9aaa">when the person asking is senior and in a</text>
<text x="18" y="562" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8f9aaa">hurry.</text>
</svg>