<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 596" width="360" height="596" role="img" aria-label="log analysis diagram">
<rect width="360" height="596" fill="#0e1116"/>
<rect x="18" y="18" width="324" height="86" rx="3" fill="#141820" stroke="#262d38" stroke-width="1"/>
<circle cx="34" cy="38" r="3.5" fill="#8f9aaa"/>
<text x="44" y="42" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8f9aaa">01</text>
<text x="72" y="43" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#f2f5f9">Ingest</text>
<text x="34" y="64" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">Windows Security events normalized</text>
<text x="34" y="81" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">into Splunk</text>
<path d="M 176 107 l 4 5 l 4 -5" fill="none" stroke="#66717f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="18" y="116" width="324" height="86" rx="3" fill="#141820" stroke="#262d38" stroke-width="1"/>
<circle cx="34" cy="136" r="3.5" fill="#8f9aaa"/>
<text x="44" y="140" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8f9aaa">02</text>
<text x="72" y="141" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#f2f5f9">Detect</text>
<text x="34" y="162" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">SPL groups failed logons by source</text>
<text x="34" y="179" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">host and account</text>
<path d="M 176 205 l 4 5 l 4 -5" fill="none" stroke="#66717f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="18" y="214" width="324" height="86" rx="3" fill="#0f1c2e" stroke="#3d9bff" stroke-width="2"/>
<circle cx="34" cy="234" r="3.5" fill="#3d9bff"/>
<text x="44" y="238" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8f9aaa">03</text>
<text x="72" y="239" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#f2f5f9">Tune</text>
<text x="34" y="260" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">Threshold raised until routine noise</text>
<text x="34" y="277" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">drops out</text>
<path d="M 176 303 l 4 5 l 4 -5" fill="none" stroke="#66717f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="18" y="312" width="324" height="86" rx="3" fill="#141820" stroke="#262d38" stroke-width="1"/>
<circle cx="34" cy="332" r="3.5" fill="#8f9aaa"/>
<text x="44" y="336" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#8f9aaa">04</text>
<text x="72" y="337" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#f2f5f9">Respond</text>
<text x="34" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">Triage notes and escalation criteria</text>
<text x="34" y="375" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#aab4c2">written for reuse</text>
<line x1="18" y1="406" x2="342" y2="406" stroke="#262d38" stroke-width="1"/>
<text x="18" y="420" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.6" fill="#8f9aaa">EVIDENCE</text>
<text x="18" y="440" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#f2f5f9">Event ID 4625</text>
<text x="18" y="460" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#f2f5f9">80+ failed logons isolated</text>
<text x="18" y="480" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#f2f5f9">One defined time window</text>
<text x="18" y="500" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#f2f5f9">Repeatable by someone else</text>
<text x="18" y="530" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8f9aaa">The tuning step is where most of the work</text>
<text x="18" y="546" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#8f9aaa">went. A detection nobody trusts gets muted.</text>
</svg>