<text x="60.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">01</text>
<text x="48.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Report</text>
<text x="48.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">User report captured with</text>
<text x="48.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">sender, link and affected host</text>
<rect x="360.0" y="28" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="380.0" cy="52" r="4" fill="#8995a6"/>
<text x="392.0" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">02</text>
<text x="380.0" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Analyse</text>
<text x="380.0" y="110" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">Process activity and event</text>
<text x="380.0" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">logs reviewed for indicators</text>
<rect x="28.0" y="144" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#1470af" stroke-width="2"/>
<circle cx="48.0" cy="168" r="4" fill="#1470af"/>
<text x="60.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">03</text>
<text x="48.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Contain</text>
<text x="48.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">Isolation, account protection</text>
<text x="48.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">and blocking decided</text>
<rect x="360.0" y="144" width="312.0" height="96" rx="3" fill="#ffffff" stroke="#dde6f1" stroke-width="1"/>
<circle cx="380.0" cy="168" r="4" fill="#8995a6"/>
<text x="392.0" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#8995a6">04</text>
<text x="380.0" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="-0.4" fill="#0d1521">Write up</text>
<text x="380.0" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">Incident summary for readers</text>
<text x="380.0" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#4d596a">who were not involved</text>
<line x1="28" y1="256" x2="672" y2="256" stroke="#dde6f1" stroke-width="1"/>
<text x="28" y="274" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.8" fill="#8995a6">EVIDENCE GOAL</text>
<text x="28.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">Delivery</text>
<text x="360.0" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">Execution</text>
<text x="28.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">Persistence</text>
<text x="360.0" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#0d1521">Containment</text>
<text x="28" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#8995a6">The output is a timeline somebody else can audit, not a list</text>
<text x="28" y="375" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#8995a6">of tools run.</text>
