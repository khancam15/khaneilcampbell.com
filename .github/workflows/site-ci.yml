name: Site CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle:
        description: Also package the site and its page inventory for download
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Site audit (scripts, pages, links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: python -m compileall -q scripts
      - name: Lint (pyflakes rules)
        run: ruff check --select F scripts
      - run: bash -n scripts/security-check.sh
      # Security headers, accessibility basics, internal links and credential-shaped strings.
      - run: python scripts/site_audit.py .
      - run: python scripts/site_inventory.py . --output site-inventory.json
      - name: Package the site
        if: github.event_name == 'workflow_dispatch' && inputs.bundle
        run: git archive --format=zip -o khaneilcampbell.com-site.zip HEAD -- . ':!docs' ':!scripts' ':!.github'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.bundle
        with:
          name: khaneilcampbell.com-site
          path: |
            khaneilcampbell.com-site.zip
            site-inventory.json
