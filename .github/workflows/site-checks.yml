name: Site Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 13:00 UTC, so external links that rot between changes still surface.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Shared shell and full audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every page matches _partials/
        run: python3 scripts/build.py . --check

      - name: Site audit (security, accessibility basics, local links, CSP sync)
        run: python3 scripts/site_audit.py .

      - name: Security audit
        run: bash scripts/security-check.sh .

  links:
    name: Link checker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Links to khaneilcampbell.com are checked against this checkout, so a
      # new page's canonical URL passes before it is deployed.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml
            --no-progress
            --root-dir ${{ github.workspace }}
            --remap '^https://khaneilcampbell\.com/$ file://${{ github.workspace }}/index.html'
            --remap '^https://khaneilcampbell\.com/(.*)$ file://${{ github.workspace }}/$1'
            './*.html'

  lighthouse:
    name: Lighthouse accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Settings and the 100 accessibility score gate are in lighthouserc.json.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
